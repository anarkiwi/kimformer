name: Demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: docker
          tags: kimformer-tools
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: make demo-check
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - uses: actions/cache@v6
        with:
          path: tests/fixtures/cache
          key: fixtures-${{ hashFiles('kimformer/fixtures.py') }}
      - run: make fixtures cov
      - name: v5 transcripts against dfrotz
        env:
          DFROTZ: docker run --rm -i -v /tmp:/tmp -v ${{ github.workspace }}:${{ github.workspace }} kimformer-tools dfrotz
        run: make test PYTEST_ARGS="tests/test_v5.py -k dfrotz --no-cov"
      - uses: actions/upload-artifact@v7
        with:
          name: demo
          path: |
            build/demo.z3
            build/demo.dfrotz.txt
