name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to attach the images to
        required: true

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e extern/kimdos -e .
      - run: docker pull ghcr.io/anarkiwi/docker-mos-llvm-sdk:v23.1.0
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: docker
          tags: kimformer-tools
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: make kim
      - run: make kim VT100=0 BUILD=build/plain
      - run: make demo
      - name: attach
        run: |
          mkdir -p release
          cp build/kimformer.ptp build/kimformer.prg build/demo.z3 release/
          cp build/plain/kimformer.ptp release/kimformer-tty.ptp
          cp build/plain/kimformer.prg release/kimformer-tty.prg
          gh release upload "$TAG" release/* --clobber
